<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">

      <p-toast></p-toast>
      <p-confirmDialog></p-confirmDialog>

      <p-toolbar class="mb-4">
        <ng-template pTemplate="left">
          <h5 class="m-0">Egresos</h5>
        </ng-template>
        <ng-template pTemplate="right">
          <button pButton pRipple label="Nuevo Egreso" icon="pi pi-plus" class="p-button-success" (click)="openNew()"></button>
        </ng-template>
      </p-toolbar>

      <div class="surface-100 border-round p-3 mb-4">
        <strong>Total de egresos registrados:</strong> {{ totalEgresos | currency }}
      </div>

      <div class="flex justify-content-end mb-3">
        <div class="p-inputgroup" style="max-width: 300px;">
          <input type="text" pInputText placeholder="Escriba la fecha" [(ngModel)]="busquedaFecha" (keyup.enter)="dt.filterGlobal(busquedaFecha, 'contains')" />
          <button pButton pRipple icon="pi pi-search" label="Buscar" (click)="dt.filterGlobal(busquedaFecha, 'contains')"></button>
        </div>
      </div>

      <p-table #dt [value]="egresos" responsiveLayout="scroll" [rows]="10"
               [globalFilterFields]="['descripcion', 'fecha']"
               [paginator]="true" [rowsPerPageOptions]="rowsPerPageOptions" dataKey="id_egreso">

        <ng-template pTemplate="header">
          <tr>
            <th>Descripción</th>
            <th class="text-center">Fecha</th>
            <th class="text-center">Valor</th>
            <th class="text-center" style="width: 8rem">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-datos>
          <tr>
            <td>{{ datos.descripcion }}</td>
            <td class="text-center">{{ datos.fecha }}</td>
            <td class="text-center">{{ datos.valor | currency }}</td>
            <td>
              <div class="flex justify-content-center gap-2">
                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-warning" (click)="editarEgreso(datos)"></button>
                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="confirmarEliminar(datos)"></button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center">No hay egresos registrados.</td>
          </tr>
        </ng-template>
      </p-table>

      <p-dialog [(visible)]="egresoDialog" [style]="{width:'450px'}" [header]="editando ? 'Editar Egreso' : 'Nuevo Egreso'" [modal]="true" class="p-fluid">
        <ng-template pTemplate="content">

          <div class="field">
            <label for="descripcionEgreso">Descripción</label>
            <textarea pInputTextarea id="descripcionEgreso" [(ngModel)]="egreso.descripcion" rows="2"
                      [ngClass]="{'ng-invalid': submitted && !egreso.descripcion}"></textarea>
            <small *ngIf="submitted && !egreso.descripcion" class="p-error">Requerido.</small>
          </div>

          <div class="formgrid grid">
            <div class="field col-6">
              <label for="fechaEgreso">Fecha</label>
              <input type="date" pInputText id="fechaEgreso" [(ngModel)]="egreso.fecha"
                     [ngClass]="{'ng-invalid': submitted && !egreso.fecha}" />
              <small *ngIf="submitted && !egreso.fecha" class="p-error">Requerido.</small>
            </div>
            <div class="field col-6">
              <label for="valorEgreso">Valor</label>
              <p-inputNumber id="valorEgreso" [(ngModel)]="egreso.valor" mode="currency" currency="USD" locale="en-US"
                             [ngClass]="{'ng-invalid': submitted && egreso.valor == null}"></p-inputNumber>
              <small *ngIf="submitted && egreso.valor == null" class="p-error">Requerido.</small>
            </div>
          </div>

        </ng-template>
        <ng-template pTemplate="footer">
          <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
          <button pButton pRipple label="Guardar" icon="pi pi-check" [loading]="guardando" (click)="guardarEgreso()"></button>
        </ng-template>
      </p-dialog>

    </div>
  </div>
</div>
