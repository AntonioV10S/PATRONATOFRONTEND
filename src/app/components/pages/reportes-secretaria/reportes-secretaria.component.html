<div class="grid">
  <div class="col-12">
    <div class="card px-4 py-4">
      <p-toast></p-toast>
      <h5 class="mb-4">Generar Reporte</h5>

      <p-panel header="Control Diario" [toggleable]="true" [collapsed]="true" styleClass="mb-3">
        <div class="formgrid grid p-fluid mb-3">
          <div class="field col-6">
            <label for="fechaControl">Fecha</label>
            <input type="date" pInputText id="fechaControl" [(ngModel)]="fechaControlDiario" />
          </div>
          <div class="field col-6">
            <label for="rolControl">Servicio</label>
            <p-dropdown id="rolControl" [(ngModel)]="idRolControlDiario" [options]="roles" optionLabel="rol" optionValue="id_rol" placeholder="Seleccionar"></p-dropdown>
          </div>
        </div>
        <div class="flex gap-2">
          <button pButton pRipple label="Medicina General" icon="pi pi-file-pdf" class="p-button-outlined" [loading]="generando === 'diarioMG'" (click)="controlDiarioMG()"></button>
          <button pButton pRipple label="Rehabilitación Física" icon="pi pi-file-pdf" class="p-button-outlined" [loading]="generando === 'diarioRF'" (click)="controlDiarioRF()"></button>
        </div>
      </p-panel>

      <p-panel header="Consolidado Mensual de Recaudación" [toggleable]="true" [collapsed]="true" styleClass="mb-3">
        <div class="formgrid grid p-fluid mb-3">
          <div class="field col-6">
            <label for="mesConsolidado">Mes</label>
            <p-dropdown id="mesConsolidado" [(ngModel)]="mesConsolidado" [options]="meses" optionLabel="label" optionValue="value"></p-dropdown>
          </div>
          <div class="field col-6">
            <label for="yearConsolidado">Año</label>
            <input type="number" pInputText id="yearConsolidado" [(ngModel)]="yearConsolidado" />
          </div>
        </div>
        <button pButton pRipple label="Generar Consolidado" icon="pi pi-file-pdf" class="p-button-outlined" [loading]="generando === 'consolidado'" (click)="consolidadoMensual()"></button>
      </p-panel>

    </div>
  </div>
</div>
