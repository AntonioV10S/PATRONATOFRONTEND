<div class="grid">
  <div class="col-12">
    <div class="card px-4 py-4 md:px-6 md:py-6">
      <p-toast></p-toast>

      <!-- ENCABEZADO -->
      <div class="flex align-items-center gap-3 mb-4">
        <div class="flex align-items-center justify-content-center border-circle" style="width: 3rem; height: 3rem; background: #E3F2FD;">
          <i class="pi pi-calendar-plus text-xl" style="color: #1565C0;"></i>
        </div>
        <div>
          <h5 class="m-0">Agendar Cita Médica</h5>
          <span class="text-500 text-sm">Busque al paciente, elija especialidad y horario disponible</span>
        </div>
      </div>

      <!-- PASO 1: PACIENTE -->
      <div class="surface-card border-1 surface-border border-round p-4 mb-3">
        <span class="font-medium text-700 block mb-3"><i class="pi pi-user mr-2"></i>1. Datos del paciente</span>
        <div class="formgrid grid p-fluid">
          <div class="field col-12 lg:col-6">
            <label for="cedula">Cédula</label>
            <div class="p-inputgroup">
              <input type="text" pInputText id="cedula" [(ngModel)]="cedula" placeholder="Ingrese la cédula" />
              <button pButton pRipple label="Consultar" icon="pi pi-search" [loading]="buscandoPaciente" (click)="consultarPaciente()"></button>
            </div>
          </div>
          <div class="field col-12 lg:col-6">
            <label for="nombres">Nombres</label>
            <input type="text" pInputText id="nombres" [(ngModel)]="nombres" placeholder="Ingrese los nombres completos" />
          </div>
        </div>
      </div>

      <!-- PASO 2: ESPECIALIDAD Y HORARIO -->
      <div class="surface-card border-1 surface-border border-round p-4 mb-4">
        <span class="font-medium text-700 block mb-3"><i class="pi pi-calendar mr-2"></i>2. Especialidad y horario</span>
        <div class="formgrid grid p-fluid">
          <div class="field col-12 lg:col-4">
            <label for="especialidad">Especialidad</label>
            <p-dropdown id="especialidad" [(ngModel)]="especialidadSeleccionada" [options]="especialidades"
                        optionLabel="rol" optionValue="rol" placeholder="Seleccionar" (onChange)="cargarTurnos()"></p-dropdown>
          </div>
          <div class="field col-12 lg:col-4">
            <label for="fecha">Fecha de la cita</label>
            <input type="date" pInputText id="fecha" [(ngModel)]="fecha" (change)="cargarTurnos()" />
          </div>
          <div class="field col-12 lg:col-4">
            <label for="horaCita">Hora de la cita</label>
            <p-dropdown id="horaCita" [(ngModel)]="idTurnoSeleccionado" [options]="turnosDisponibles" [loading]="cargandoTurnos"
                        optionLabel="hora" optionValue="id_turno" placeholder="Seleccione especialidad y fecha primero"></p-dropdown>
          </div>
        </div>
      </div>

      <div class="flex justify-content-end">
        <button pButton pRipple label="Agendar Cita" icon="pi pi-check" [loading]="guardando" (click)="agendarCita()"></button>
      </div>
    </div>
  </div>
</div>
